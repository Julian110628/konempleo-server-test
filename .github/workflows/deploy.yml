name: Build and Deploy BackendApp to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Setting an environment variable with the value of a configuration variable
  ECR_BACKEND_IMAGE: ${{ vars.ECR_BACKEND_IMAGE }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
  RDS_USER: ${{ vars.RDS_USER }}
  RDS_PASSWORD: ${{ vars.RDS_PASSWORD }}
  RDS_HOST: ${{ vars.RDS_HOST }}
  RDS_PORT: ${{ vars.RDS_PORT }}
  RDS_NAME: ${{ vars.RDS_NAME }}
  OAI_KEY: ${{ secrets.OPENAI_API_KEY }}
  SDUSERNAME: ${{ vars.SDUSERNAME }}
  SDPASSWORD: ${{ vars.SDPASSWORD }}
  AWS_KEY: ${{ vars.AWS_KEY }}
  AWS_SECRET_KEY: ${{ vars.AWS_SECRET_KEY }}
  SDBASIC_AUTH_TOKEN: ${{ vars.SDBASIC_AUTH_TOKEN }}
  TUSDATOS_USER: ${{ vars.TUSDATOS_USER }}
  TUSDATOS_SECRET: ${{ vars.TUSDATOS_SECRET }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Create env file
        run: |
          touch app/.env
          echo DB_USER="$RDS_USER" >> app/.env
          echo DB_PASSWORD="$RDS_PASSWORD" >> app/.env
          echo DB_HOST="$RDS_HOST" >> app/.env
          echo DB_PORT=$RDS_PORT >> app/.env
          echo DB_NAME="$RDS_NAME" >> app/.env
          echo OAI_KEY="$OAI_KEY" >> app/.env
          echo SDUSERNAME="$SDUSERNAME" >> app/.env
          echo SDPASSWORD="$SDPASSWORD" >> app/.env
          echo SDBASIC_AUTH_TOKEN="$SDBASIC_AUTH_TOKEN" >> app/.env
          echo ACCESS_TOKEN_EXPIRE_MINUTES=1440 >> app/.env
          echo ALGORITHM="HS256" >> app/.env
          echo SECRET_KEY="vvdgDFsvxlkL5MnATd+PRwg+0v+HWM633MrMWsFa" >> app/.env
          echo BUCKET_NAME="konempleo-prod-bucket" >> app/.env
          echo AWS_KEY="$AWS_KEY" >> app/.env
          echo AWS_SECRET_KEY="$AWS_SECRET_KEY" >> app/.env
          echo SDTEMPLATE_ID=2261 >> app/.env
          echo tusDatosUser="$TUSDATOS_USER" >> app/.env
          echo tusDatosSecret="$TUSDATOS_SECRET" >> app/.env

      - name: Set up QEMU for x86_64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: runner.os == 'Linux'

      - name: Set up Docker for x86_64
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/x86_64

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t konempleo .

      - name: Tag Docker image with ECS task definition
        run: |
          docker tag konempleo:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_BACKEND_IMAGE:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_BACKEND_IMAGE:latest

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PEM_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend to EC2
        run: |
          ssh ubuntu@${{ vars.EC2_HOST }} << EOF
            set -e

            # Red docker del reverse-proxy (para que siga resolviendo "backend")
            NET=\$(sudo docker inspect -f '{{range \$k,\$v := .NetworkSettings.Networks}}{{println \$k}}{{end}}' reverse-proxy | head -n 1)

            if [ -z "\$NET" ]; then
              echo "ERROR: No pude detectar la red docker de reverse-proxy"
              sudo docker ps
              exit 1
            fi

            # Crear env file
            sudo bash -lc 'printf "%s\n" \
          "SDUSERNAME=${{ vars.SDUSERNAME }}" \
          "SDPASSWORD=${{ vars.SDPASSWORD }}" \
          "SDBASIC_AUTH_TOKEN=${{ vars.SDBASIC_AUTH_TOKEN }}" \
          "tusDatosUser=${{ vars.TUSDATOS_USER }}" \
          "tusDatosSecret=${{ vars.TUSDATOS_SECRET }}" \
          "DB_USER=${{ vars.RDS_USER }}" \
          "DB_PASSWORD=${{ vars.RDS_PASSWORD }}" \
          "DB_HOST=${{ vars.RDS_HOST }}" \
          "DB_PORT=${{ vars.RDS_PORT }}" \
          "DB_NAME=${{ vars.RDS_NAME }}" \
          "SECRET_KEY=${{ vars.SECRET_KEY }}" \
          "ALGORITHM=${{ vars.ALGORITHM }}" \
          "ACCESS_TOKEN_EXPIRE_MINUTES=${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES }}" \
          "OAI_KEY=${{ secrets.OPENAI_API_KEY }}" \
          "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
          "AWS_REGION=${{ vars.AWS_DEFAULT_REGION }}" \
          "AWS_S3_BUCKET=${{ vars.AWS_S3_BUCKET }}" \
          "BUCKET_NAME=${{ vars.BUCKET_NAME }}" \
          "ENABLE_EMAILS=${{ vars.ENABLE_EMAILS }}" \
          "SES_CONFIGURATION_SET=${{ vars.SES_CONFIGURATION_SET }}" \
          > /home/ubuntu/konempleo.env'
            sudo chmod 600 /home/ubuntu/konempleo.env
            
            sudo docker stop backend || true
            sudo docker rm backend || true

            # --- LOGIN A ECR SIN AWSCLI LOCAL (usa contenedor aws-cli) ---
            sudo docker run --rm \
              -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
              -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
              -e AWS_DEFAULT_REGION='${{ vars.AWS_DEFAULT_REGION }}' \
              amazon/aws-cli:2 \
              ecr get-login-password --region '${{ vars.AWS_DEFAULT_REGION }}' \
            | sudo docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_DEFAULT_REGION }}.amazonaws.com

            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}"
            echo "AWS_DEFAULT_REGION=${{ vars.AWS_DEFAULT_REGION }}"
            echo "ECR_BACKEND_IMAGE=${{ vars.ECR_BACKEND_IMAGE }}"

            sudo docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_DEFAULT_REGION }}.amazonaws.com/${{ vars.ECR_BACKEND_IMAGE }}:latest

            sudo docker run -d \
              --name backend \
              --network "\$NET" \
              --env-file /home/ubuntu/konempleo.env \
              --restart unless-stopped \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_DEFAULT_REGION }}.amazonaws.com/${{ vars.ECR_BACKEND_IMAGE }}:latest
          EOF

